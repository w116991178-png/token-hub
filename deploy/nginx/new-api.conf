# new-api 前后端分离部署 - Nginx 示例配置
#
# 架构：Nginx 直接托管前端静态文件（release/frontend），API 请求反向代理到 new-api 后端。
# 前端使用同源相对请求（baseURL 为空），因此与后端同域即可，无需额外 CORS 配置。
#
# 使用步骤：
#   1. 将 release/frontend 目录部署到本配置中的 root 路径（如 /var/www/new-api）。
#   2. 后端 new-api 运行在 127.0.0.1:3000（可改端口，或用 -port 参数）。
#      建议通过 systemd / supervisor 守护进程方式运行。
#   3. 按需修改 server_name、SSL、root。
#   4. 校验并重载：nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name api.example.com;   # 改成你的域名

    # 前端静态资源根目录（对应 release/frontend）
    root /var/www/new-api;
    index index.html;

    # 带哈希的前端构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- API：反向代理到后端 new-api ----
    # 以下前缀均为后端接口，必须代理到后端
    location ~ ^/(api|v1|v1beta|pg|kling|jimeng|mj|suno|dashboard) {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Midjourney 的“模式”风格路由（如 /openai/mj/...），按需启用
    # location ~ ^/[a-zA-Z0-9_-]+/mj/ {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_redirect off;
    # }

    # OpenAI Realtime 等 WebSocket 接口
    location /v1/realtime {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ---- SPA 前端路由回退：非接口、非静态文件均返回 index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}

